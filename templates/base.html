<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page_title }} — {{ site_title }}{% endblock title %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --color-bg: #ffffff;
      --color-surface: #f0f0f0;
      --color-text: #111111;
      --color-text-muted: #555555;
      --color-link: #0055cc;
      --color-border: #dddddd;
      --color-bg-error: #fff0f0;
      --color-border-error: #ee8888;
      --color-error: #cc0000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #111111;
        --color-surface: #1e1e1e;
        --color-text: #eeeeee;
        --color-text-muted: #888888;
        --color-link: #77aaff;
        --color-border: #444444;
        --color-bg-error: #2a0808;
        --color-border-error: #aa4444;
        --color-error: #ff6666;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--color-bg);
      font-family: Georgia, 'Times New Roman', serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      color: var(--color-text);
      line-height: 1.65;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 0;
      margin-bottom: 2rem;
    }
    header a { text-decoration: none; color: inherit; }
    header .site-name { font-weight: bold; font-size: 1.1rem; }
    header nav { display: flex; gap: 1rem; font-size: 0.9rem; }
    header nav a { color: var(--color-text-muted); }
    code, pre { font-family: 'Menlo', 'Consolas', monospace; }
    pre {
      background: var(--color-surface);
      padding: 1rem;
      overflow-x: auto;
      border-radius: 3px;
    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--color-border); padding: 0.4rem 0.75rem; text-align: left; }
    th { background: var(--color-surface); }
    .page-actions { margin-top: 2.5rem; font-size: 0.85rem; color: var(--color-text-muted); }
    .page-actions a { color: var(--color-text-muted); }
    .flash-error {
      background: var(--color-bg-error);
      border: 1px solid var(--color-border-error);
      padding: 0.6rem 1rem;
      margin-bottom: 1.5rem;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <a class="site-name" href="/">{{ site_title }}</a>
    <nav>
      {% if user %}
        <span>{{ user.name }}</span>
        <a href="/auth/logout">Sign out</a>
      {% else %}
        <a href="/auth/login">Sign in</a>
      {% endif %}
    </nav>
  </header>
  {% block content %}{% endblock content %}
</body>
</html>
