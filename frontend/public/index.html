<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>org-wiki</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/elm.js"></script>
    <script>
      var app = Elm.Main.init({ node: document.getElementById("app") });

      // setPageContent — inject server-rendered HTML into the wiki content div.
      // Uses requestAnimationFrame so the div exists after Elm's DOM update.
      app.ports.setPageContent.subscribe(function (html) {
        requestAnimationFrame(function () {
          var el = document.getElementById("wiki-content");
          if (el) el.innerHTML = html;
        });
      });

      // setPreviewContent — inject preview HTML into the preview div.
      app.ports.setPreviewContent.subscribe(function (html) {
        requestAnimationFrame(function () {
          var el = document.getElementById("preview-content");
          if (el) el.innerHTML = html;
        });
      });

      // Intercept clicks on internal links inside injected HTML so Elm can
      // handle them as SPA navigations rather than full page reloads.
      document.addEventListener("click", function (e) {
        var content =
          document.getElementById("wiki-content") ||
          document.getElementById("preview-content");
        if (!content || !content.contains(e.target)) return;

        var a = e.target.closest("a[href]");
        if (!a) return;

        var href = a.getAttribute("href");
        if (
          a.hostname === window.location.hostname &&
          !href.startsWith("/auth/") &&
          !href.startsWith("/api/")
        ) {
          e.preventDefault();
          app.ports.linkClicked.send(href);
        }
      });
    </script>
  </body>
</html>
